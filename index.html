<html>
  <body>
    <h1>ESOL Nexus archive</h1>
    <p>Archive of files from the ESOL Nexus website esol.britishcouncil.org.</p>
    <p>Videos available at <a href="https://www.youtube.com/channel/UCBha5xeBsF0PTBzcx6VrUew">YouTube</a>
    <div>
    <script>
      (async () => {
        const response = await fetch('https://api.github.com/repos/esol-eu/esol/contents/');
        const data = await response.json();
        let htmlString = '<ul>';

        for (let file of data) {
          if (file.name.startsWith('.')) continue; // skip dotfiles/folders
          htmlString += `<li><a href="${file.path}">${file.name}</a></li>`;
        }

        htmlString += '</ul>';
        document.getElementsByTagName('div')[0].innerHTML = htmlString;
      })()
    </script>
    </div>
  <body>
</html>
